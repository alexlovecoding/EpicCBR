  c_temps: [0.2]
  scen_lambdas: [0.0] # the scenario loss weight: lambda_3
  edges_enhanced_strengths: [0.2]

  interaction_threshold: 0 # for new bpr
  k_item_loss: 0
  item_relation_types: [2,3] #only use high ui with low bi
  scenario_weights: [1.0] # the weight for the hot and cold start scenarios 1 means totally hot

  epochs: 50
  test_interval: 5 


